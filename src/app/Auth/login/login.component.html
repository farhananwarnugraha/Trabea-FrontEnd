<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-96 max-w-full bg-white p-8 rounded shadow-lg">
    <h2 class="text-2xl font-bold text-center text-gray-500">
      Login
    </h2>
    @if (isLogin === false) {
      <p class="text-red-500 text-center">Invalid Login, Check your account</p>
    }
    <form (submit)="onSubmit()" [formGroup]="loginForm">
      <div class="mb-4">
        <label for="email" class="block text-gray-700 font-medium mb-2">Email</label>
        <input type="email"
        id="email"
        class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-transparent"
        placeholder="email"
        formControlName="email">
      </div>
      <div class="mb-4">
        <label for="password" class="block text-gray-700 font-medium mb-2">Password</label>
        <input
          type="password"
          id="password"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Enter your password"
          formControlName="password"
        />
      </div>
      <div class="mb-4">
        <label for="role" class="block text-gray-700 font-medium mb-2">Role</label>
        <select name="role" id="role" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" formControlName="role">
          <option [value]="0" selected>Chose a Role</option>
          <option [value]="1">Administrator</option>
          <option [value]="2">Manager</option>
          <option [value]="3">PartTimer</option>
        </select>
      </div>
      <div class="mb-4">
        <button class="w-full bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600 transition">
          Login
        </button>
      </div>
    </form>
  </div>
</div>
