@if(openModal === true){
  <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
      <h2 class="text-xl font-semibold mb-2">Part Timer Detail</h2>
      <hr class="border-t border-gray-300">
      <table>
        <tr>
          <td>Full Name</td>
          <td>:</td>
          <td>{{ detailPartTimeEmployee.fullName }}</td>
        </tr>
        <tr>
          <td>Personal Email</td>
          <td>:</td>
          <td>{{ detailPartTimeEmployee.personalEmail }}</td>
        </tr>
        <tr>
          <td>Work Email</td>
          <td>:</td>
          <td>{{ detailPartTimeEmployee.workEmail }}</td>
        </tr>
        <tr>
          <td>Personal Phone Number</td>
          <td>:</td>
          <td>{{ detailPartTimeEmployee.personalPhoneNumber }}</td>
        </tr>
      </table>
      <button class="mt-4 bg-red-500 text-white py-2 px-4 rounded hover:bg-red-600" (click)="closeModal()">
        Close
      </button>
    </div>
  </div>
}
