<p class="text-2xl">Shift Schedule</p>
<div class="flex justify-between mt-0">
  <button class="bg-blue-600 p-2 text-white font-bold rounded-md mb-4 mt-3" (click)="previousWeek()">Previous Week</button>
  <button class="bg-blue-600 p-2 text-white font-bold rounded-md mb-4 mt-3" (click)="changeWeek()">Next Week</button>
</div>
<div>
    <table class="border-collapse rounded-sm border border-slate-500 w-full ">
      <thead class="border border-collapse">
        <tr class="py-4">
          <th class="border border-slate-600">Date</th>
          @for (shift of workShifts; track $index) {
            <th class="border border-slate-600">Shift {{ shift.id }} <br> {{ shift.shiftTime }}</th>
          }
        </tr>
      </thead>
      <tbody>
        @for (day of days; track $index) {
          <tr>
            <td class="border border-slate-600 text-center">
              <div>{{ day.day }}</div>
              <div>{{ day.date }}</div>
            </td>
            @for (shift of day.shifts; track $index) {
              <td class="border border-slate-600 text-center">
                {{ shift }}
              </td>
            }
          </tr>
        }
      </tbody>
    </table>
</div>
